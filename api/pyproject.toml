[project]
name = "paperboard-api"
version = "0.1.0"
description = "PaperBoard API, MCP connector and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Full-width punctuation is correct in Chinese text.
allowed-confusables = ["，", "：", "；", "（", "）", "！", "？"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external services; skipped unless run with -m live"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
