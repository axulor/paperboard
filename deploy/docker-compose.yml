# Run from the repository root.
#   Database only, for development:  docker compose -f deploy/docker-compose.yml up -d --wait db
#   Everything, at localhost:8080:   docker compose -f deploy/docker-compose.yml up -d --build --wait
#
# The defaults are for local use. On a server, set PAPERBOARD_DB_PASSWORD (letters and digits:
# it goes into a URL), PAPERBOARD_SITE_ADDRESS, PAPERBOARD_SITE_URL, PAPERBOARD_MCP_URL and
# PAPERBOARD_PUBLIC_HOSTS in the environment or in deploy/.env.

x-api-image: &api-image
  image: paperboard-api:local
  build: ../api

x-database-url: &database-url
  PAPERBOARD_DATABASE_URL: postgresql+psycopg://paperboard:${PAPERBOARD_DB_PASSWORD:-paperboard}@db:5432/paperboard

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: paperboard
      POSTGRES_USER: paperboard
      POSTGRES_PASSWORD: ${PAPERBOARD_DB_PASSWORD:-paperboard}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "paperboard", "-d", "paperboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the database migrations, then exits. api starts after it succeeds.
  migrate:
    <<: *api-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      <<: *database-url
      PAPERBOARD_PUBLIC_HOSTS: ${PAPERBOARD_PUBLIC_HOSTS:-[]}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: paperboard-web:local
    build:
      context: ../web
      args:
        PAPERBOARD_SITE_URL: ${PAPERBOARD_SITE_URL:-http://localhost:8080}
        PAPERBOARD_MCP_URL: ${PAPERBOARD_MCP_URL:-http://localhost:8080/mcp}
    environment:
      PAPERBOARD_API_URL: http://api:8000
      PAPERBOARD_SITE_URL: ${PAPERBOARD_SITE_URL:-http://localhost:8080}
      PAPERBOARD_MCP_URL: ${PAPERBOARD_MCP_URL:-http://localhost:8080/mcp}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      PAPERBOARD_SITE_ADDRESS: ${PAPERBOARD_SITE_ADDRESS:-:8080}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
