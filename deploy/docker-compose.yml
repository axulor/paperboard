services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: paperboard
      POSTGRES_USER: paperboard
      POSTGRES_PASSWORD: paperboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "paperboard", "-d", "paperboard"]
      interval: 5s
      timeout: 3s
      retries: 10
