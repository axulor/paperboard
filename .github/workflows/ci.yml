name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the request set
        run: python skill/scripts/check_requests.py
      - name: Check the plugin package
        run: python skill/scripts/check_package.py
      - name: Unit tests of the eval runner
        run: python -m unittest discover -s skill/tests -v

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paperboard_test
          POSTGRES_USER: paperboard
          POSTGRES_PASSWORD: paperboard
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U paperboard -d paperboard_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # only full version tags are published
        with:
          working-directory: api
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Verify database migrations
        env:
          PAPERBOARD_DATABASE_URL: postgresql+psycopg://paperboard:paperboard@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/paperboard_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Run API tests
        env:
          PAPERBOARD_TEST_DATABASE_URL: postgresql+psycopg://paperboard:paperboard@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/paperboard_test
        run: uv run pytest --cov

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check the API types match api/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api/schema.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
